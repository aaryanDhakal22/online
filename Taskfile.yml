version: "3"

# online/ Taskfile.
#
# Authentication:
#   We don't run `doppler login` / `doppler setup`. Each task that needs
#   Doppler reads the service token from {{.DOPPLER_TOKEN_FILE}} (the file
#   contains *only* the raw token, nothing else) and prefixes it onto the
#   `doppler run` invocation. The token is scoped to a single Doppler
#   config, so Doppler infers project + config from it.
#
# {{.DOPPLER_TOKEN_FILE}} is gitignored. Tasks that don't need secrets
# (build, vet, go test, scp deploys) skip the env var entirely.

vars:
  DOPPLER_TOKEN_FILE: .doppler-dev-online
  DEV_CONFIG: ./docker/docker-compose.dev.yml
  PROD_CONFIG: ./docker/docker-compose.prod.yml

tasks:
  default:
    desc: List tasks
    cmds:
      - "{{.TASK_EXE}} --list"

  # ---- Dev stack (docker compose) ---------------------------------------

  devup:
    desc: Start the dev stack (foreground)
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- docker compose -f {{.DEV_CONFIG}} up

  devupd:
    desc: Start the dev stack (detached)
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- docker compose -f {{.DEV_CONFIG}} up -d

  devdown:
    desc: Stop the dev stack
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- docker compose -f {{.DEV_CONFIG}} down

  devrestart:
    desc: Restart the dev stack
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- docker compose -f {{.DEV_CONFIG}} down
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- docker compose -f {{.DEV_CONFIG}} up

  devreset:
    desc: Reset the dev stack (drops images and rebuilds)
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- docker compose -f {{.DEV_CONFIG}} down
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- docker compose -f {{.DEV_CONFIG}} down --rmi all
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- docker compose -f {{.DEV_CONFIG}} up --build

  dev-del-volumes:
    desc: Drop the dev sqlite volume (wipes the api_keys table)
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- docker compose -f {{.DEV_CONFIG}} down -v

  dev-config:
    desc: Print the resolved docker-compose config
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- docker compose -f {{.DEV_CONFIG}} config

  dev-logs:
    desc: "Tail logs for a service: task dev-logs -- api"
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- docker compose -f {{.DEV_CONFIG}} logs -f {{.CLI_ARGS}}

  # ---- Build & Go-side checks (no secrets needed) -----------------------

  build:
    desc: Build the backend binary to backend/tmp/main
    dir: ./backend
    cmds:
      - mkdir -p tmp
      - go build -o ./tmp/main ./cmd/server

  vet:
    desc: Run go vet on the backend
    dir: ./backend
    cmds:
      - go vet ./...

  test-go:
    desc: Run Go unit tests for online/backend
    dir: ./backend
    cmds:
      - go test ./...

  # ---- Python integration suite ----------------------------------------

  test:
    desc: "Run online/tests pytest suite (dev stack must be up)"
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- uv run --directory tests pytest -v

  test-quick:
    desc: "Run only the fast subset of online/ tests"
    cmds:
      - DOPPLER_TOKEN=$(cat {{.DOPPLER_TOKEN_FILE}}) doppler run -- uv run --directory tests pytest -v -m "not slow"

  # ---- Deploy helpers ---------------------------------------------------

  transport-compose:
    desc: Send the prod docker-compose to the Lightsail box
    cmds:
      - scp {{.PROD_CONFIG}} lightsail-api:/opt/ingest/docker-compose.yml

  # ──────────────────────────────────────────────────────────────────────
  # Versioning — see ../scripts/version.sh. Releases (tags) go through the
  # quicc-ops deploy/release.sh only; there is no release task here.
  # ──────────────────────────────────────────────────────────────────────

  version-current:
    desc: Show the current version (./VERSION)
    silent: true
    cmds:
      - ../scripts/version.sh current

  version-describe:
    desc: VERSION + git describe diagnostics
    silent: true
    cmds:
      - ../scripts/version.sh describe

  version-init:
    desc: "Create initial v0.1.0 (or override): task version-init -- 0.2.0"
    cmds:
      - ../scripts/version.sh init {{.CLI_ARGS}}

  version-bump:
    desc: "Bump and tag: task version-bump -- patch|minor|major"
    cmds:
      - ../scripts/version.sh bump {{.CLI_ARGS}}
