server {
    listen 80;
    server_name localhost;

    # Docker's embedded DNS lives at 127.0.0.11. Setting `resolver` plus
    # using a variable in `proxy_pass` defers upstream resolution until
    # request time. Without this, nginx 1.x resolves upstreams at startup
    # and the whole daemon dies if the `api` container isn't ready yet —
    # that's the "host not found in upstream" error.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Static frontend.
    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API. Variable assignment forces lazy DNS resolution; the
    # path is preserved as-is so /api/v1/... routes through to echo.
    location /api/ {
        set $upstream_api "api:1323";
        proxy_pass http://$upstream_api;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
