name: Verify, build & push (GHCR)

# ─────────────────────────────────────────────────────────────────────────────
# CI for online/.
#
# Jobs:
#   1. verify           — go vet + go test + pytest. Blocks every build.
#   2. build-staging    — every branch push. Tags (floating ones move):
#                           staging → staging-latest (floating), staging-<sha7>
#                           master  → master-<sha7> (never deployed)
#                           other   → branch-<slug>
#                         Never writes `latest` / `prod-latest` (what prod runs).
#   3. build-production — semver tag push only (v1.2.3). Tags:
#                           1.2.3, prod-v1.2.3 (immutable)
#
# NOTE: `master` still holds v1 until the cutover, and v1's own workflow on
# master SSH-deploys prod. Push v2 to `staging` only (../CUTOVER.md).
#
# verify runs the API as a plain binary built on the runner (cached Go) next
# to an ElasticMQ container — the dev compose stack (air + sqlc install, then
# air compiling in the container) took ~140 s just to start. The staging api
# image packages a binary built the same way (backend/Dockerfile.ci). Docs-only
# pushes don't run CI; a newer push to the same branch cancels the older run.
#
# CI builds + pushes images to GHCR ONLY — it does NOT deploy or SSH anywhere
# (no LIGHTSAIL_*/SSH secrets). Rolling a built image out to a host is manual
# (planned: orchestrated from the console).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"] # not applied to tag pushes
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/online-api
  NGINX_IMAGE: ghcr.io/${{ github.repository_owner }}/online-nginx

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Verify — Go-side checks plus the pytest suite booted under compose.
  #    Env vars in the compose-up step are intentionally inline (not
  #    secrets): they're CI test values pointing at a local ElasticMQ.
  #    Real prod values live in Doppler and never enter this workflow.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify (go test + pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-test-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-test-${{ hashFiles('backend/go.sum') }}-
            go-test-

      - name: ElasticMQ
        run: |
          docker run -d --name elasticmq -p 9324:9324 \
            -v "$PWD/docker/elasticmq.conf:/opt/elasticmq.conf:ro" softwaremill/elasticmq-native:latest

      - name: go vet
        working-directory: ./backend
        run: go vet ./...

      - name: go test
        working-directory: ./backend
        run: go test ./...

      - name: Start the API (binary)
        working-directory: ./backend
        env:
          APP_ENV: dev
          DOMAIN: localhost
          LOG_LEVEL: info
          LOG_STYLE: console
          SERVER_PORT: "1323"
          RATE_LIMIT_PER_SEC: "0"
          SQS_QUEUE_URL: http://localhost:9324/000000000000/dev-ingest
          SQS_ENDPOINT: http://localhost:9324
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          DEFAULT_API_KEY: ci-test-key
          # argon2id hash of the literal string "ci-pass". Re-derivable; the
          # plaintext is also literally "ci-pass" — see the pytest step below.
          ADMIN_PASS_HASH: '$argon2id$v=19$m=65536,t=1,p=8$qhAOqMLJoqw56/nQxq9A/g$V0qiwavNMjflt7LSPF/AqQb6+DHhOTuajEmM9D5ByAY'
          TZ: America/New_York
        run: |
          go build -o "$RUNNER_TEMP/online" ./cmd/server
          DB_PATH="$RUNNER_TEMP/app.db" nohup "$RUNNER_TEMP/online" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:1323/health >/dev/null && { echo "api is up"; exit 0; }
            sleep 1
          done
          echo "api did not come up in 30s"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install --upgrade uv

      - name: Run pytest
        env:
          APP_ENV: dev
          DEV_URL: http://localhost
          DEV_BACKEND_PORT: "1323"
          ADMIN_PASSCODE: ci-pass
        run: |
          uv run --directory tests pytest -v

      - name: API log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Staging — runs on every branch push (not on tags).
  # ───────────────────────────────────────────────────────────────────────────
  build-staging:
    name: Build staging image (${{ matrix.name }})
    needs: verify
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: "" # a binary built on the runner (step below)
            file: ./backend/Dockerfile.ci
            image: ghcr.io/${{ github.repository_owner }}/online-api
            target: ""
          - name: proxy
            context: .
            file: ./nginx/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/online-nginx
            target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go (api)
        if: matrix.name == 'api'
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/cache@v4
        if: matrix.name == 'api'
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ hashFiles('backend/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ hashFiles('backend/go.sum') }}-
            go-build-
      - name: Context
        id: ctx
        run: |
          if [ "${{ matrix.name }}" = api ]; then
            mkdir -p "$RUNNER_TEMP/image/data"
            (cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
              -ldflags "-w -s -X main.version=$(tr -d '[:space:]' < ../VERSION) -X main.commit=${GITHUB_SHA}" \
              -o "$RUNNER_TEMP/image/app" ./cmd/server)
            echo "context=$RUNNER_TEMP/image" >> "$GITHUB_OUTPUT"
          else
            echo "context=${{ matrix.context }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute staging tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=staging-latest,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,prefix=staging-,format=short,enable=${{ github.ref == 'refs/heads/staging' }}
            type=sha,prefix=master-,format=short,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/master' }}

      - name: Build and push staging image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.ctx.outputs.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=staging-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.name }}

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Production — semver tag push only. Same matrix as staging.
  # ───────────────────────────────────────────────────────────────────────────
  build-production:
    name: Build production image (${{ matrix.name }})
    needs: verify
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            file: ./backend/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/online-api
            target: runtime
          - name: proxy
            context: .
            file: ./nginx/Dockerfile
            image: ghcr.io/${{ github.repository_owner }}/online-nginx
            target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute production tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=prod-v{{version}}

      - name: Read VERSION (from tag)
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=prod-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=prod-${{ matrix.name }}

  # ───────────────────────────────────────────────────────────────────────────
  # Deploy is intentionally NOT part of CI.
  #
  # The former `deploy` job (SSH → Lightsail, `docker compose pull && up -d` on a
  # v* tag) was removed 2026-07-11. CI now ONLY builds + pushes images to GHCR —
  # it never touches a host, uses no LIGHTSAIL_* / SSH secrets, and cannot affect
  # prod. Rolling a built image out to a host is done manually (planned:
  # orchestrated from the console). Re-introducing any host access here should be
  # a deliberate, reviewed change.
  # ───────────────────────────────────────────────────────────────────────────
