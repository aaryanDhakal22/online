include classpath("application.conf")

# ElasticMQ for online/'s dev + staging stacks. Standard (non-FIFO) queue
# matches main/'s setup so the two stacks can share queue semantics; if
# you want main/ and online/ to actually exchange messages locally, both
# point at the same ElasticMQ instance and use this same queue name.

node-address {
    protocol = http
    host = "*"
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

queues {
    dev-ingest {
        defaultVisibilityTimeout = 30 seconds
        receiveMessageWait = 5 seconds
        fifo = false
        # Mirror AWS redrive: a message main can't process (unroutable store,
        # bad payload) moves to the DLQ after 3 receives instead of cycling
        # every visibility timeout forever.
        deadLettersQueue {
            name = "dev-ingest-dlq"
            maxReceiveCount = 3
        }
    }
    dev-ingest-dlq {
        defaultVisibilityTimeout = 30 seconds
    }
}
