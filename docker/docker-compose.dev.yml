services:
  elasticmq:
    image: softwaremill/elasticmq-native:latest
    container_name: quicc_online_elasticmq
    restart: unless-stopped
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf
    ports:
      # Host port 9324 is the same port main/ exposes its ElasticMQ on.
      # Only one of the two stacks can claim it on the host at a time.
      # If you run online + main together in dev, comment out the host
      # mapping here (the api container reaches it via the docker network
      # on `elasticmq:9324` regardless).
      - "9324:9324"

  elasticmq-ui:
    image: softwaremill/elasticmq-ui:latest
    container_name: quicc_online_elasticmq_ui
    restart: unless-stopped
    # main/'s UI is on 3000; we use 3001 to avoid the conflict.
    ports:
      - "3001:3000"
    environment:
      SQS_ENDPOINT: http://elasticmq:9324
    depends_on:
      - elasticmq

  api:
    container_name: quicc_online_backend
    build:
      context: ../backend
      target: dev
    restart: always
    environment:
      APP_ENV:
      DOMAIN:
      LOG_LEVEL:
      LOG_STYLE:
      SERVER_PORT:
      RATE_LIMIT_PER_SEC:
      SQS_QUEUE_URL:
      SQS_ENDPOINT:
      AWS_REGION:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      DEFAULT_API_KEY:
      ADMIN_PASS_HASH:
      # Required: stamped on every SQS publish as MessageAttributes for
      # main/ to scope by. Use the placeholder UUIDs seeded by main/'s
      # migration until you mint real tenants via main's /admin.
      SCOPE_TENANT_ID:
      SCOPE_LOCATION_ID:
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_HEADERS:
      OTEL_SERVICE_NAME:
      PUSHOVER_APP_TOKEN:
      NOTIFICATION_BOSS:
      NOTIFICATION_AARYAN:
      DB_PATH:
      TZ: America/New_York
    volumes:
      - ../backend:/src
      - ~/.aws:/root/.aws:ro
      - sqlite_data:/data
      # Go module + build caches survive container recreation, so air's first
      # compile after a `devreset`/recreate is incremental.
      - go_mod:/go/pkg/mod
      - go_build:/root/.cache/go-build
    ports:
      # Host bind port is sourced from Doppler (DEV_HOST_PORT) — set to 1324 in
      # online's dev config so it doesn't collide with main on one box. The
      # container still listens on 1323 (SERVER_PORT).
      - "${DEV_HOST_PORT:-1324}:1323"
    depends_on:
      - elasticmq
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:1323/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: quicc_reverse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqlite_data:
  go_mod:
  go_build:
