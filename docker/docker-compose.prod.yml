services:
  api:
    # Tag is pinnable via ONLINE_API_TAG in /opt/ingest/.env (managed by the
    # GHA deploy step). `prod-latest` is the safe default — it tracks the
    # newest semver tag that CI pushed.
    image: ghcr.io/aaryandhakal22/online-api:${ONLINE_API_TAG:-prod-latest}
    container_name: quicc_online_backend
    restart: always
    environment:
      APP_ENV:
      DOMAIN:
      LOG_LEVEL:
      LOG_STYLE:
      SERVER_PORT:
      RATE_LIMIT_PER_SEC:
      SQS_QUEUE_URL:
      AWS_REGION:
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      DEFAULT_API_KEY:
      ADMIN_PASS_HASH:
      OTEL_EXPORTER_OTLP_ENDPOINT:
      OTEL_EXPORTER_OTLP_HEADERS:
      OTEL_SERVICE_NAME:
      PUSHOVER_APP_TOKEN:
      NOTIFICATION_BOSS:
      NOTIFICATION_AARYAN:
      DB_PATH:
      TRUST_PROXY: "1"
    ports:
      - "1323:1323"
    volumes:
      - /opt/ingest/data:/data

  proxy:
    image: ghcr.io/aaryandhakal22/online-nginx:${ONLINE_NGINX_TAG:-prod-latest}
    container_name: quicc_online_proxy
    restart: unless-stopped
    depends_on:
      certbot_init:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"

  certbot_init:
    image: certbot/dns-cloudflare:latest
    container_name: quicc_certbot_init
    environment:
      CLOUDFLARE_API_TOKEN:
      CERTBOT_DOMAIN:
      CERTBOT_EMAIL:
    volumes:
      - letsencrypt:/etc/letsencrypt
      - letsencrypt_logs:/var/log/letsencrypt
      - ./scripts/certbot.sh:/certbot.sh:ro
    entrypoint: /certbot.sh
    command: ["init"]

  certbot_renew:
    image: certbot/dns-cloudflare:latest
    container_name: quicc_certbot_renew
    restart: unless-stopped
    depends_on:
      certbot_init:
        condition: service_completed_successfully
    environment:
      CLOUDFLARE_API_TOKEN:
      CERTBOT_DOMAIN:
      CERTBOT_EMAIL:
    volumes:
      - letsencrypt:/etc/letsencrypt
      - letsencrypt_logs:/var/log/letsencrypt
      - ./scripts/certbot.sh:/certbot.sh:ro
    entrypoint: /certbot.sh
    command: ["renew"]

volumes:
  letsencrypt:
  letsencrypt_logs:
